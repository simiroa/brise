# 기능 카탈로그: notes 도메인 (인덱스 — 세부는 $ref 대상이 SSOT)
features:
  - id: F-N01
    name: 폴더 트리 + 노트 CRUD
    status: shipped
    commands: commands/notes.yaml
    db: [db/schemas/notes.sql, db/schemas/folders.sql]
    service: service/notes.yaml
    verify:
      rust: src-tauri/src/repo/notes/mod.rs
      vitest: src/lib/noteQuery.test.ts
      smoke: boot
    cases:
      - id: create-stamps-now-iso
        given:
          title: "Fresh Note"
        expect:
          title: "Fresh Note"
        covered_by: test_create_still_stamps_now_iso

      - id: create-today-default-explicit-ymd
        given:
          year: 1592
          month: 5
          day: 13
        expect:
          year: "1592"
        covered_by: test_create_today_default_respects_explicit_values

      - id: create-timestamp-leaves-month-day-null
        given:
          year: 1592
          month: omitted
          day: omitted
        expect:
          year: "1592"
        covered_by: test_create_with_timestamp_leaves_month_day_null_when_omitted

      - id: set-location-persists-and-validates
        given:
          title: "Location Note"
          lat: 48.8566
          lng: 2.3522
        expect:
          title: "Location Note"
          lat: "48.8566"
          lng: "2.3522"
        covered_by: test_note_set_location_persists_and_validates_range

      - id: folder-list-lightweight-tags-via-index
        given:
          title: "Light Note"
          tags: ["alpha", "beta"]
          image: "x.png"
        expect:
          title: "Light Note"
          tag_a: "alpha"
          tag_b: "beta"
          no_tags: "folder_list must not ship tags"
          no_image: "folder_list must not ship has_image"
        covered_by: test_folder_list_is_lightweight_tags_via_index

      - id: set-event-end-rejects-invalid-range
        given:
          start: 1794-01-01
          bad: [end_day without end_month, end_month without end_year, end before start]
        expect:
          end_day: "end_day requires end_month"
          end_month: "end_month requires end_year"
          reverse: "start must not be after"
        covered_by: test_set_event_end_invariants_and_range

      - id: folder-list-and-query-expose-end
        given:
          title: "Exposed"
          end: 1502-03
        expect:
          title: "Exposed"
          end_year: "1502"
        covered_by: test_note_query_and_folder_list_expose_end

      - id: set-schedule-roundtrip
        given:
          start_time: "09:00"
          end_time: "10:30"
          rrule: "FREQ=WEEKLY;BYDAY=MO,WE"
        expect:
          start_time: "09:00"
          end_time: "10:30"
          rrule: "FREQ=WEEKLY;BYDAY=MO,WE"
        covered_by: test_set_schedule_persists_and_round_trips

      - id: last7-date-range
        given:
          now: "2026-07-28T15:00:00.000Z"
          dateRange: last7
        expect:
          from: "2026-07-22"
          to: "2026-07-28"
        covered_by: "last7 spans 7 UTC calendar days inclusive, ending today"

      - id: last7-utc-day-boundary
        given:
          now: "2026-01-01T23:30:00.000Z"
          dateRange: last7
        expect:
          from: "2025-12-26"
          to: "2026-01-01"
        covered_by: "uses the UTC date, not the local date, near a UTC day boundary"

      - id: omits-updated-range-when-absent
        given:
          dateRange: null
        expect:
          omitted_from: "updated_from"
          omitted_to: "updated_to"
        covered_by: "omits updated_from/updated_to when dateRange is absent or null"

  - id: F-N02
    name: 멀티 섹션 에디터 (마크다운 자동 저장)
    status: shipped
    commands: commands/sections.yaml
    service: service/notes.yaml#autosave
    verify:
      rust: src-tauri/src/repo/sections.rs
    cases:
      - id: create-defaults-to-text-kind
        given:
          kind: omitted
        expect:
          kind: "text"
        covered_by: create_defaults_to_text_kind

      - id: create-diagram-section-roundtrip
        given:
          kind: diagram
          body: flowchart
        expect:
          kind: "diagram"
          # 싱글쿼트: rust 소스의 `\n` 이스케이프와 바이트 단위로 같아야 한다.
          body_md: 'flowchart TD\n  A --> B'
        covered_by: create_with_body_and_kind_makes_a_diagram_section

      - id: create-sheet-section-roundtrip
        given:
          kind: sheet
          name: "가계부"
        expect:
          kind: "sheet"
          name: "가계부"
          body: '{"v":1,"rows":100,"cols":[],"cells":{}}'
        covered_by: create_with_body_and_kind_makes_a_sheet_section

      - id: create-rejects-unknown-kind
        given:
          kind: "bogus"
        expect:
          kind: "bogus"
        covered_by: create_with_body_and_kind_rejects_unknown_kind

  - id: F-N03
    name: 원문 사료 패널 (read-only)
    status: shipped
    commands: commands/sources.yaml
    verify:
      vitest: src/components/SourcePanel.test.tsx
    cases:
      - id: presets-for-fresh-draft
        given:
          draft: true
          body: empty
          previewItem: null
        expect:
          presets: "preset-list-stub"
          preview: "preview-attachment-stub"
        covered_by: "shows presets for a fresh draft (baseline, unchanged)"

      - id: presets-when-attachment-unselected
        given:
          attachments: ["a1"]
          previewItem: null
        expect:
          presets: "preset-list-stub"
        covered_by: "shows presets when an attachment exists but NOTHING is selected in the preview"

      - id: hides-presets-when-attachment-selected
        given:
          previewItem: { kind: attachment, id: "a1" }
        expect:
          preview: "preview-attachment-stub"
          presets: "preset-list-stub"
        covered_by: "hides presets once that attachment is actually selected"

      - id: stale-preview-shows-presets
        given:
          previewItem: { kind: attachment, id: "from-another-note" }
        expect:
          stale: "from-another-note"
          presets: "preset-list-stub"
        covered_by: "shows presets when a STALE previewItem from another note can't resolve here"

      - id: related-preview-hides-presets
        given:
          previewItem: { kind: note, id: "related-1" }
        expect:
          related: "related-1"
          preview: "preview-attachment-stub"
        covered_by: "hides presets when a resolved preview item exists (e.g. previewing a related note), even with empty body and no attachments"

      - id: body-content-keeps-presets
        given:
          body: "real content"
          previewItem: null
        expect:
          body: "real content"
          presets: "preset-list-stub"
        covered_by: "keeps presets when the body has content but nothing is actually being previewed"

      - id: collapsed-28px-rail
        given:
          previewCollapsed: true
        expect:
          rail: "source-panel-collapsed-rail"
          width: "28px"
        covered_by: "collapsed: renders the 28px rail, not PresetList/PreviewAttachment content"

      - id: expanded-fills-column-width
        given:
          previewCollapsed: false
        expect:
          flex: "0 0 auto"
          width: "100%"
          drop: "source-panel-drop-target"
        covered_by: "expanded (not collapsed): the card fills the column's width, not its content width"

      - id: history-hidden-until-entries
        given:
          previewPast: []
          previewFuture: []
        expect:
          back: "preview-history-back"
          forward: "preview-history-forward"
        covered_by: "hides back/forward until history has entries"

      - id: back-steps-previous-preview
        given:
          past: ["a1"]
          current: "a2"
        expect:
          back: "preview-history-back"
        covered_by: "back steps to the previous preview selection"

  - id: F-N04
    name: 첨부파일 (복사 저장 + OS 열기 + 사진·음성 메타 자동 반영)
    status: shipped
    commands: commands/attachments.yaml
    verify:
      rust:
        - src-tauri/src/repo/attachments/mod.rs
        - src-tauri/src/repo/attachments/exif_region.rs
        - src-tauri/src/repo/settings_schema.rs
        - src-tauri/src/sync_server/handlers.rs
      vitest:
        - src/lib/fileKinds.test.ts
    cases:
      - id: normalize-stored-name
        given:
          names: ["사진.png", "my photo.png", "a(1)#b%c.png", "???.???"]
        expect:
          hangul: "사진.png"
          spaces: "my-photo.png"
          punct: "a-1-b-c.png"
          fallback: "attachment"
        covered_by: normalize_stored_name_rules

      - id: add-file-keeps-display-name
        given:
          src: "my photo (final).png"
        expect:
          name: "my photo (final).png"
          reason: "DB display name must stay original"
        covered_by: add_file_normalizes_stored_name_but_keeps_display_name

      - id: link-url-allowlist-rejects-nonhttp
        given:
          urls: ["http://example.com", "javascript:alert(1)", "file:///C:/Windows/System32/calc.exe"]
        expect:
          ok: "http://example.com"
          javascript: "javascript:alert(1)"
          file: "file:///C:/Windows/System32/calc.exe"
        covered_by: link_url_allowlist_rejects_nonhttp_schemes

      - id: footnote-read-text-roundtrip
        given:
          text: "각주 본문입니다"
          anchor: "앵커"
        expect:
          text: "각주 본문입니다"
        covered_by: read_text_roundtrips_footnote_and_gates_kind

      - id: add-footnote-empty-rejected
        given:
          text: ["", "   ", "\\n\\t"]
        expect:
          reason: "should reject empty text"
        covered_by: test_add_footnote_empty_text_rejected

      - id: footnote-survives-export
        given:
          text: "export me"
          anchor: "anchor"
        expect:
          body: "export me"
          reason: "footnote .md body must be copied into export sidecar"
        covered_by: test_footnote_survives_export_as_file_attachment

      - id: add-file-stores-sha256
        given:
          bytes: "brise sync phase 0 content hash test"
        expect:
          bytes: "brise sync phase 0 content hash test"
        covered_by: add_file_computes_and_stores_sha256_content_hash

      - id: remove-deletes-original-and-thumb
        given:
          file: "shot.png"
        expect:
          original: "original must be removed"
          thumb: "thumbnail must be removed with the attachment"
        covered_by: remove_deletes_original_and_thumbnail

      - id: gps-from-file-hemisphere
        given:
          refs: ["N/E", "S/W"]
        expect:
          present: "GPS present"
        covered_by: meta_from_file_reads_hemisphere_refs

      - id: dedupe-within-100m
        given:
          existing: { name: "서울시청", lat: 37.5665, lng: 126.9780 }
          near: 50m
          far: 500m
        expect:
          name: "서울시청"
        covered_by: dedupe_within_100m_skips_but_farther_does_not

      - id: auto-meta-exifless-noop
        given:
          file: "nogps.png"
        expect:
          file: "nogps.png"
        covered_by: auto_meta_hook_adds_nothing_for_exifless_image

      # S2-1 (PLAN-2026-10-06-s2-input.md §1·§3) — 사진 EXIF·음성 업로드 메타의 자동 반영.
      # 결정: 정책은 photo_meta_mode(off|ask|auto, 기본 auto) 하나. off 면 EXIF·지오코딩(외부 요청) 생략,
      # ask 면 attachment-meta-suggested 이벤트만, auto 면 반영 뒤 attachment-meta-applied(되돌리기 id).
      # 대표 날짜는 연 정밀도뿐일 때만 채우고 아니면 관련 날짜(label "사진"/"음성")로 — 덮어쓰지 않는다.
      - id: photo-meta-fixture-matrix
        given:
          fixtures: ["GPS+촬영시각", "촬영시각만", "GPS만", "둘 다 없음", "시계 미설정 쓰레기 값"]
        expect:
          taken: "2026:10:03 14:32:05"
        covered_by: meta_from_file_fixture_matrix

      - id: representative-date-never-overwritten
        given:
          primary: "2025-01-02 (일 정밀도)"
          photo: "2026-10-03"
        expect:
          reason: "대표 보존"
        covered_by: apply_never_overwrites_an_existing_representative_date

      - id: burst-same-day-one-date-row
        given:
          photos: 5
        expect:
          dates: "연사 5장 → 관련 날짜 1행"
          regions: "100m dedupe → 지역 1행"
        covered_by: burst_of_five_same_day_makes_one_date_row

      - id: photo-meta-off-skips-geocoding
        given:
          photo_meta_mode: off
        expect:
          reason: "off 에서는 지오코딩(외부 요청) 0"
        covered_by: hook_off_skips_exif_and_geocoding_entirely

      - id: photo-meta-mode-settings-round-trip
        given:
          keys: ["photo_meta_mode", "voice_transcribe_mode", "voice_cleanup_mode"]
        expect:
          scope: "PC 공유 전역 키"
        covered_by: test_s2_input_modes_default_validate_and_round_trip

      - id: media-kind-and-mime-in-sync
        given:
          exts: ["webm", "opus", "heic"]
        expect:
          webm: "audio/webm"
        covered_by: kind_and_guess_mime_stay_in_sync_for_media

      - id: image-exts-mirror-rust-kind
        given:
          ext: heic
        expect:
          ext: "heic"
        covered_by: image 팔 = ATTACHMENT_IMAGE_EXTS (heic/heif 포함)

  - id: F-N05
    name: 노트 내보내기 / 전체 백업·복원 4모드
    status: shipped
    commands: commands/export.yaml
    service: service/export.yaml
    states: states/note-lifecycle.md
    verify:
      rust: src-tauri/tests/invariant_export_roundtrip.rs
    cases:
      - id: replace-roundtrip-preserves-notes
        given:
          mode: replace
          seed: Sejong + Related Partner
        expect:
          title: "Sejong"
          partner: "Related Partner"
          bundle: "brise-bundle.json"
        covered_by: full_roundtrip

      - id: replace-preserves-fts-and-source
        given:
          mode: replace
          search: "훈민정음"
        expect:
          query: "훈민정음"
          source: "원문.txt"
        covered_by: full_roundtrip

      - id: replace-preserves-region-schedule-icon
        given:
          mode: replace
        expect:
          region: "Hanseong"
          start_time: "09:30"
          rrule: "FREQ=WEEKLY;BYDAY=MO,WE"
          icon: "crown"
          waypoint: "Gyeongbokgung"
        covered_by: full_roundtrip

      - id: replace-preserves-space-and-status
        given:
          mode: replace
        expect:
          space: "Main Canvas"
          sticky: "Sticky Note Memo"
          status: "Relecture"
        covered_by: full_roundtrip

      - id: merge-skips-conflicts
        given:
          mode: merge
          extra: "Extra"
        expect:
          extra: "Extra"
          mode: "merge"
        covered_by: merge_skips_conflicts

      - id: future-version-rejected
        given:
          version: i64::MAX
          mode: replace
        expect:
          bundle: "brise-bundle.json"
        covered_by: future_version_rejected

      - id: traversal-rejected
        given:
          rel_path: "../../evil.exe"
          mode: merge
        expect:
          rel_path: "../../evil.exe"
          not_written: "evil.exe"
        covered_by: traversal_rejected

  - id: F-N06
    name: 휴지통 / 아카이브
    status: shipped
    commands: commands/notes.yaml
    states: states/note-lifecycle.md
    verify:
      rust: src-tauri/src/repo/notes/mod.rs
    cases:
      - id: trash-soft-delete-hides
        given:
          title: "Trash Test Note"
          action: delete
        expect:
          title: "Trash Test Note"
          no_cascade: "soft delete must not cascade children"
        covered_by: test_trash_lifecycle_soft_delete_restore_purge

      - id: trash-restore-returns-to-list
        given:
          after: restore
        expect:
          title: "Trash Test Note"
        covered_by: test_trash_lifecycle_soft_delete_restore_purge

      - id: purge-cascades-children
        given:
          after: purge
        expect:
          cascade: "purge must cascade-delete children"
        covered_by: test_trash_lifecycle_soft_delete_restore_purge

      - id: archive-hidden-but-fts-searchable
        given:
          title: "Archive Test Note"
          action: archive
        expect:
          title: "Archive Test Note"
          fts: "archived notes must stay in FTS — archive() must not call fts_delete"
        covered_by: test_archive_lifecycle_hidden_but_fts_searchable_and_unarchive_restores

      - id: unarchive-restores-to-tree
        given:
          after: unarchive
        expect:
          title: "Archive Test Note"
        covered_by: test_archive_lifecycle_hidden_but_fts_searchable_and_unarchive_restores

      - id: purge-tombstones-note-only
        given:
          title: "Tombstone Note"
          action: purge
        expect:
          title: "Tombstone Note"
          note: "purge must tombstone the note itself"
          children: "cascaded children must not get their own tombstones"
        covered_by: test_purge_tombstones_note_only_not_cascaded_children

  - id: F-N07
    name: 파일 ↔ 섹션 (가져오기/내보내기)
    status: shipped
    commands: [commands/sections.yaml, commands/export.yaml]
    service: service/extraction.yaml
    verify:
      rust:
        - src-tauri/src/commands/sections.rs
        - src-tauri/src/repo/csv_import.rs
        - src-tauri/src/repo/xlsx_import.rs
        - src-tauri/src/repo/import_scan.rs
        - src-tauri/src/repo/extraction.rs
        - src-tauri/src/repo/transfer/export.rs
      vitest:
        - src/lib/fileKinds.test.ts
        - src/lib/sheet/fromMatrix.test.ts
        - src/components/AttachmentsBar.test.tsx
        - src/components/Toast.test.tsx
        - src/components/editor/useEditorFileDrop.handleDrop.test.ts
        - src/components/editor/EditorPanel.dropZone.contract.test.ts
        - src/lib/noteActions.test.ts
        - src/components/editor/SectionTabBar.test.tsx
    cases:
      - id: csv-rfc4180-quotes
        given:
          file: "name,note / \"Kim, Bob\" ... (RFC 4180 따옴표·이스케이프·셀 안 개행)"
        expect:
          a2: "Kim, Bob"
        covered_by: test_csv_import_rfc4180_quotes

      - id: csv-cp949-fallback
        given:
          file: "CP949로 저장된 한글 CSV (엑셀 기본 저장본)"
        expect:
          decoded_as: "EUC_KR"
        covered_by: test_csv_import_cp949_fallback

      - id: csv-truncates-at-sheet-limits
        given:
          file: "1001행 × 53열 CSV"
        expect:
          rows: "1000"
        covered_by: test_csv_import_truncates_beyond_limits

      - id: hwpx-sections-concatenated-in-order
        given:
          file: "Contents/section1.xml 이 zip 안에서 section0.xml 보다 먼저 저장된 hwpx"
        expect:
          tail: "Second"
        covered_by: test_hwpx_extracts_paragraph_text

      - id: pptx-slides-concatenated-in-order
        given:
          file: "ppt/slides/slide2.xml 이 zip 안에서 slide1.xml 보다 먼저 저장된 pptx"
        expect:
          head: "## Slide 1"
        covered_by: test_pptx_extracts_slides_in_order

      - id: export-section-md-rejects-non-text
        given:
          section_kind: "sheet"
        expect:
          code: "VALIDATION"
        covered_by: test_export_section_md_rejects_non_text_kind

      - id: drop-routing-sets-are-exclusive
        given:
          sets: "ATTACHMENT_IMAGE_EXTS ∩ SECTION_IMPORT_EXTS"
        expect:
          section_import_has: "hwpx"
        covered_by: image and section-import extension sets never overlap (drop routing must be exclusive)

      - id: import-batch-continues-after-failure
        given:
          files: "3개 중 2번째가 실패"
        expect:
          command: "section_import_file"
        covered_by: keeps going after one file fails, returns the sections that did succeed

      - id: xlsx-one-section-per-worksheet
        given:
          file: "워크시트 2장짜리 xlsx"
        expect:
          second_section_name: "Costs"
        covered_by: test_xlsx_two_worksheets_become_two_sections_named_by_sheet

      - id: xlsx-date-cell-becomes-iso
        given:
          cell: "엑셀 날짜 셀"
        expect:
          raw: "2023-01-01"
        covered_by: test_xlsx_date_cell_becomes_iso_string

      - id: scan-expands-folder-and-counts-skips
        given:
          paths: "폴더 하나(지원 파일 + 미지원 파일 + 숨김 파일 혼재)"
        expect:
          unsupported_skipped: "ignore.exe"
        covered_by: test_scan_expands_directory_and_counts_unsupported_as_skipped

      - id: scan-unreadable-path-is-not-fatal
        given:
          paths: "사라진 경로 1개 + 읽을 수 있는 파일 1개"
        expect:
          still_imported: "a.md"
        covered_by: test_scan_unreadable_path_is_skipped_not_fatal

      - id: directory-import-is-rejected
        given:
          file_path: "디렉터리"
        expect:
          error: "AppError::Validation"
        covered_by: directory_path_is_rejected_as_validation

      - id: promote-source-tile-copies-body-in-place
        given:
          tile: "사료 타일 우클릭"
        expect:
          command: "section_create_with_body"
        covered_by: "source tile: context menu row always appears; clicking it hits section_create_with_body, never section_import_file"

      - id: promote-attachment-tile-resolves-path
        given:
          tile: "가져오기 가능한 첨부(.md) 우클릭"
        expect:
          command: "section_import_file"
        covered_by: "promotable attachment (.md, desktop baseDir set): context menu row appears; clicking it resolves baseDir+rel_path and hits section_import_file, never section_create_with_body"

      - id: promote-hidden-for-fileless-tile
        given:
          tile: "링크 첨부(디스크에 파일 없음)"
        expect:
          menu: "no promote row"
        covered_by: "link attachment (no rel_path — nothing on disk) shows no promote row on right-click"

      - id: clipboard-matrix-preserves-cell-content
        given:
