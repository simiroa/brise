# 기능 카탈로그 규약 — specs/features/*.yaml (이 파일은 카탈로그가 아님, 파서가 건너뛴다)
#
# 목적: 기능 목록별 건강도. Playwright/e2e가 아니라 이미 있는 게이트(rust/vitest/smoke)에
# 기능을 연결하고, 유형별 입력→출력 기대값을 케이스로 적는다.
# 검사: scripts/check-features.mjs (`npm run check`에 포함).
#
# status: shipped | in_progress | removed
#   shipped     — verify 필수. 경로가 없거나 케이스가 테스트와 끊기면 게이트 실패.
#   in_progress — verify 선택. 없는 건 구멍으로만 보고.
#   removed     — 검증 안 함. 부활 금지 표시.
#
# verify:
#   rust:   파일 또는 디렉터리. 파일은 #[test]가 있어야 하고, 디렉터리는 그 아래 .rs 중
#           하나 이상에 #[test]가 있어야 한다(테스트는 프로덕션 .rs 안에 같이 산다).
#   vitest: 파일 또는 디렉터리. *.test.ts / *.test.tsx 만 센다.
#   smoke:  지금은 `boot`만. scripts/smoke.mjs 전역 부팅(여정 e2e 아님).
#
# cases: 기대값 테이블. 수집처럼 "유형별 입력이 이 출력을 낸다"를 여기 적는다.
#   id:          기능 안 유일
#   given:       입력(사람이 읽음. 게이트는 안 실행)
#   expect:      출력. 길이 4자 이상 문자열은 covered_by 테스트 파일에 그대로 있어야 한다.
#                테스트가 그 리터럴을 단언하지 않으면 게이트가 실패한다 = 기대값 SSOT.
#   covered_by:  rust는 `fn 이름`, vitest는 it("제목") 문자열. verify 파일 안에 있어야 한다.
#
# 숫자/bool expect는 오탐이 커서 리터럴 대조를 하지 않는다. 문자열로 써라.
# 네트워크가 필요한 fetch 자체는 유닛 케이스에 넣지 않는다(SSRF 가드·파서·ingest만).
conventions:
  status: [shipped, in_progress, removed]
  smoke: [boot]
  expect_literal_min_chars: 4
