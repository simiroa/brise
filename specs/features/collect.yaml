        - src-tauri/src/collect/daynote.rs
        - src-tauri/src/collect/mod.rs
        - src-tauri/src/sync_server/ingest.rs
    notes: 동기화 후 같은 폴더에 제목이 똑같은 일자 노트("브라우징 기록 — 날짜", "클로드 프롬프트 —
      proj 날짜")가 두 개 이상 생기면 collect::daynote::find_or_merge_day_note가 하나로 합친다 —
      가장 오래된 노트(동률이면 id가 작은 쪽)를 생존자로 삼아 첫 섹션 줄을 오래된 순으로 이어붙이고
      (정확히 같은 줄·같은 (url) needle은 첫 것만 남김, "## 요약" 블록은 최신 것이 이김), 나머지는
      deleted_at + fts_delete로 소프트 삭제한다(activity_log는 안 남김 — 사용자가 지운 게 아니라
      자동 수렴이라). 결정적 노트 id(날짜+제목 해시로 시드)는 기각했다 — 노트 id는 이미 첨부·태그·
      내부 링크가 참조하는 진짜 식별자라 사후에 결정적으로 바꾸면 그 참조가 깨진다. 이 헬퍼는
      collect::mod.rs::ingest_item_parts와 sync_server::ingest.rs::append_visit이 공유한다(예전엔
      각자 `ORDER BY created_at DESC`로 "가장 최근" 노트를 골라 두 경로가 다른 생존자에 합의할 수
      있었다 — 지금은 둘 다 가장 오래된 쪽으로 통일).
