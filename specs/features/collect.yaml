# 기능 카탈로그: 수집 관문. 유형별 입력→출력 기대값이 여기 산다.
# 게이트는 cases.expect 문자열이 covered_by 테스트 파일에 그대로 있는지로 연결을 강제한다.
features:
  - id: F-C01
    name: RSS/Atom 어댑터
    status: shipped
    commands: commands/collect.yaml
    verify:
      rust:
        - src-tauri/src/collect/rss.rs
        - src-tauri/src/collect/config.rs
    cases:
      - id: rss2-guid-html-strip
        given:
          kind: rss
          feed: RSS 2.0 item with CDATA HTML description and <guid>
        expect:
          guid: "urn:uuid:first-1"
          title: "First Post"
          body_md: "Hello world"
          source_url: "https://example.com/first"
          published_at: "Mon, 01 Jan 2024 00:00:00 GMT"
        covered_by: parses_rss2_items_including_guid_link_cdata_html_and_plain_description

      - id: rss2-guid-falls-back-to-link
        given:
          kind: rss
          feed: RSS 2.0 item with <link> but no <guid>
        expect:
          guid: "https://example.com/second"
          body_md: "Plain text summary, no CDATA & no HTML."
        covered_by: parses_rss2_items_including_guid_link_cdata_html_and_plain_description

      - id: atom-id-and-href
        given:
          kind: rss
          feed: Atom entry with <id> and link rel=alternate href
        expect:
          guid: "tag:example.com,2024:atom-1"
          title: "Atom Entry"
          source_url: "https://example.com/atom-entry"
          body_md: "An atom summary."
          published_at: "2024-01-02T00:00:00Z"
        covered_by: parses_atom_entries_including_href_link_attribute_and_id

      - id: rss-skip-item-without-guid-or-link
        given:
          kind: rss
          feed: item with title+description only
        expect:
          reason: "No identity"
        covered_by: items_missing_both_guid_and_link_are_skipped

      - id: rss-entities-resolved
        given:
          kind: rss
          title: "A &amp; B &lt;C&gt; &#38; &#x26;"
        expect:
          title: "A & B <C> & &"
        covered_by: entity_references_are_resolved_across_named_and_numeric_forms

      - id: rss-rejects-loopback-before-connect
        given:
          kind: rss
          url: "http://127.0.0.1/feed.xml"
        expect:
          blocked: "http://127.0.0.1/feed.xml"
        covered_by: collect_rejects_loopback_and_private_feed_hosts_before_connecting

      - id: rss-schema-rejects-unknown-fields
        given:
          kind: rss
          config: '{"url":"https://example.com/feed","dir":"C:/"}'
        expect:
          url: "https://example.com/feed"
        covered_by: rss_schema_rejects_unknown_fields_and_invalid_urls

  - id: F-C02
    name: Claude 세션 프롬프트 어댑터
    status: shipped
    commands: commands/collect.yaml
    verify:
      rust:
        - src-tauri/src/collect/claude_prompts.rs
        - src-tauri/src/collect/config.rs
    cases:
      - id: claude-user-only-no-assistant-leak
        given:
          kind: claude_prompts
          jsonl: user string + user array + assistant + queue-operation
        expect:
          prompt_a: "첫 번째 프롬프트"
          prompt_b: "배열 형태 프롬프트"
          leaked: "ignored"
        covered_by: extracts_only_user_messages_string_and_array_content

      - id: claude-dir-must-stay-under-projects
        given:
          kind: claude_prompts
          dir: "C:/Users/Public"
        expect:
          dir: "C:/Users/Public"
        covered_by: claude_schema_rejects_unknown_fields_and_outside_dir

      - id: oversized-session-file-yields-a-skip-notice-not-silence
        given:
          kind: claude_prompts
          file: session file over MAX_FILE_BYTES (500MB)
        expect:
          notice_contains: "건너뜀"
          guid_contains: ":skipped:"
        covered_by: a_file_over_the_new_cap_yields_exactly_one_skip_notice_part

      - id: file-under-the-raised-500mb-cap-is-parsed-not-skipped
        given:
          kind: claude_prompts
          file: 60MB session file (over the OLD 50MB cap, under the new 500MB one)
        expect:
          prompt: "large file prompt survives"
        covered_by: a_file_up_to_the_new_500mb_cap_is_no_longer_skipped_wholesale

  - id: F-C10
    name: Codex CLI 세션 프롬프트 어댑터
    status: shipped
    commands: commands/collect.yaml
    verify:
      rust:
        - src-tauri/src/collect/codex_prompts.rs
        - src-tauri/src/collect/config.rs
    notes: ~/.codex/sessions/YYYY/MM/DD/*.jsonl — claude_prompts와 같은 자세(user 메시지만,
      raw 전문 저장 안 함)지만 프로젝트는 디렉터리가 아니라 session_meta.payload.cwd에서 뽑는다.
    cases:
      - id: codex-user-only-project-from-cwd
        given:
          kind: codex_prompts
          jsonl: session_meta(cwd=brise) + event_msg echo + response_item(user)
        expect:
          guid_prefix: "codex:brise:"
          leaked: "ignored duplicate"
        covered_by: extracts_only_response_item_user_messages_and_derives_project_from_cwd

      - id: codex-environment-context-filtered
        given:
          kind: codex_prompts
          jsonl: injected <environment_context> + real prompt + today's prompt
        expect:
          body_md: "- 09:01 real prompt survives"
        covered_by: filters_the_injected_environment_context_and_includes_today

      - id: codex-dir-must-stay-under-sessions-root
        given:
          kind: codex_prompts
          dir: "C:/Users/Public"
        expect:
          dir: "C:/Users/Public"
        covered_by: codex_schema_rejects_unknown_fields_and_outside_dir

      - id: oversized-session-file-yields-a-skip-notice-under-unknown-project
        given:
          kind: codex_prompts
          file: session file over MAX_FILE_BYTES (500MB), cwd unreadable since the file itself is skipped
        expect:
          guid_prefix: "codex:unknown:"
          guid_contains: ":skipped:"
        covered_by: a_file_over_the_new_cap_yields_exactly_one_skip_notice_part_under_unknown_project

      - id: file-under-the-raised-500mb-cap-is-parsed-not-skipped
        given:
          kind: codex_prompts
          file: 60MB session file (over the OLD 50MB cap, under the new 500MB one)
        expect:
          prompt: "large file prompt survives"
        covered_by: a_file_up_to_the_new_500mb_cap_is_no_longer_skipped_wholesale

  - id: F-C03
    name: 웹페이지 어댑터
    status: shipped
    commands: commands/collect.yaml
    verify:
      rust: src-tauri/src/collect/config.rs
    notes: fetch 본문은 web_reader(SSRF 가드) 재사용. 네트워크 왕복은 여기 케이스가 아님.
    cases:
      - id: web-rejects-unknown-fields-file-and-loopback
        given:
          kind: web
          urls: ["file:///etc/passwd", "http://127.0.0.1/page"]
        expect:
          file: "file:///etc/passwd"
          loopback: "http://127.0.0.1/page"
          ok: "https://example.com/page"
        covered_by: web_schema_rejects_unknown_fields_and_invalid_urls

  - id: F-C04
    name: 유튜브(yt-dlp) 자막 수집
    status: shipped
    commands: commands/collect.yaml
    verify:
      rust:
        - src-tauri/src/collect/ytdlp.rs
        - src-tauri/src/collect/config.rs
    notes: yt-dlp 사이드카 fetch는 여기 케이스가 아님. 스키마·VTT 정제만.
    cases:
      - id: vtt-strips-headers-timestamps-dupes
        given:
          kind: youtube
          vtt: WEBVTT captions with duplicate cue
        expect:
          # 싱글쿼트: rust 소스의 `\n` 이스케이프와 바이트 단위로 같아야 한다 (더블쿼트면 YAML이 실제 개행으로 푼다).
          body_md: '안녕하세요 여러분\n오늘 소개해드릴 내용은\n브리즈의 새로운 수집 기능입니다.'
        covered_by: clean_vtt_removes_headers_timestamps_and_duplicate_lines

      - id: youtube-rejects-unknown-fields-file-and-loopback
        given:
          kind: youtube
          urls: ["file:///etc/passwd", "http://127.0.0.1/page"]
        expect:
          file: "file:///etc/passwd"
          loopback: "http://127.0.0.1/page"
          ok: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
        covered_by: youtube_schema_rejects_unknown_fields_and_invalid_urls

  - id: F-C05
    name: 수집 러너 — ingest · seen · dry_run · 주기
    status: shipped
    commands: commands/collect.yaml
    verify:
      rust:
        - src-tauri/src/collect/mod.rs
        - src-tauri/src/repo/collect.rs
    cases:
      - id: ingest-creates-note-appends-source-footer
        given:
          item: { guid: g1, title: "Title A", body: "Body A", url: "https://example.com/a" }
        expect:
          title: "Title A"
          body: "Body A"
          footer: "https://example.com/a"
        covered_by: ingest_item_creates_an_inbox_note_and_marks_the_guid_seen

      - id: ingest-same-guid-is-idempotent
        given:
          second_ingest: { guid: g1, title: "Title A (edited)" }
        expect:
          reason: "the second ingest of the same guid must not create a second note"
        covered_by: ingest_item_skips_a_guid_already_seen_for_that_source

      - id: dry-run-zero-writes-then-real-run-still-ingests
        given:
          kind: claude_prompts
          dry_run: true
        expect:
          preview: "dry run test"
          no_seen: "dry_run must not claim seen"
          no_notes: "dry_run must not create notes"
          no_clock: "dry_run must not advance last_run_at"
        covered_by: dry_run_does_not_claim_seen_or_write_notes_and_keeps_last_run_at_null

      - id: delete-source-cleans-seen
        given:
          after: collect_source_delete
        expect:
          cleanup: "collect_seen must be cleaned up on delete"
        covered_by: create_list_set_enabled_delete_round_trip

      - id: unknown-kind-does-not-touch-status
        given:
          kind: some_future_kind
        expect:
          reason: "unimplemented adapter kinds must not mark ok/error"
        covered_by: run_one_skips_a_source_whose_kind_has_no_adapter_yet_without_touching_status

  - id: F-C06
    name: 수집 설정 UI (목록 · 로컬 소스 감지/고스트 · 챗 등록 허용 토글 · 지금 실행 · 드라이런)
    status: shipped
    commands: commands/collect.yaml
    notes: 소스 추가 옆 "로컬 소스 감지" 버튼 하나(PLAN-2026-09-04-local-import §3b) —
      collect_detect_local 결과 중 source_id 가 null 인 후보를 고스트 행으로 보여주고, "가져오기"는
      collect_import_local → 기존 드라이런 모달(확인 모드) → "이대로 가져오기" → run_now 순이다.
      모달을 그냥 닫으면 소스는 남되 실행하지 않는다. 어댑터/seen 계약은 F-C12~F-C15.
    verify:
      vitest: src/components/settings/CollectSection.test.tsx
    cases:
      - id: ui-add-source-action-only-no-quick-collect-input
        given:
          ui: settings > collect
        expect:
          table_add_testid: "collect-table-add-row"
          absent_testid: "collect-quick-url-input"
        covered_by: "renders the add-source action and does not render chatbot register toggle here"

      - id: ui-run-now-toasts-added-count
        given:
          run_now: { ok: true, added: 3 }
        expect:
          command: collect_source_run_now
        covered_by: "run now calls collect_source_run_now and toasts the added count"

      - id: ui-dry-run-opens-preview
        given:
          action: test fetch
        expect:
          command: collect_source_dry_run
        covered_by: "clicking test fetch (dry run) opens preview modal with dry run items"

      - id: ui-detect-renders-ghost-rows-for-unregistered-candidates
        given:
          action: click "로컬 소스 감지"; collect_detect_local returns one candidate with source_id null and one with a source_id
        expect:
          ghost_rows: 1
        covered_by: "detect button calls collect_detect_local and renders a ghost row per candidate with a null source_id"
      - id: ui-detect-empty-state
        given:
          action: click "로컬 소스 감지"; no candidates
        expect:
          text: "No local sources detected."
        covered_by: "shows the empty-detection line when no candidates come back"
      - id: ui-ghost-import-dry-run-confirm-runs-now
        given:
          action: click "가져오기" on a ghost row, then "이대로 가져오기" in the dry-run modal
        expect:
          command: collect_source_run_now
          arg: '{ id: "created-1" }'
        covered_by: "import -> dry run -> confirm calls collect_source_run_now with the created source id and refreshes"
      - id: ui-ghost-import-close-does-not-run
        given:
          action: click "가져오기", then close the dry-run modal without confirming
        expect:
          command_not_called: collect_source_run_now
        covered_by: "closing the dry-run modal without confirming does not run the created source"
      - id: ui-ghost-browser-candidate-shows-open-tabs-hint
        given:
          action: import a browser_history candidate
        expect:
          text: "Open tabs are only recorded after you close them."
        covered_by: "shows the open-tabs hint in the dry-run modal for a browser_history candidate"

  - id: F-C07
    name: 유튜브 자막 보강 (rss 채널 피드 항목)
    status: shipped
    commands: commands/collect.yaml
    verify:
      rust: src-tauri/src/collect/mod.rs
    notes: rss 항목의 링크가 유튜브 watch URL이면 yt-dlp 자막으로 본문을 교체. run당 ENRICH_CAP=5,
      초과 unseen 항목은 결과에서 제거되어 다음 due 주기에 이월. seen 판정은 자체 커넥션 SELECT 후
      drop(락 규율 유지). 실제 yt-dlp 실행은 여기 케이스가 아님(fetch 클로저 주입).
    cases:
      - id: enrich-replaces-body-for-unseen-youtube-item
        given:
          kind: rss
          item_url: "https://www.youtube.com/watch?v=abc123"
        expect:
          body_md: "SUBTITLES HERE"
        covered_by: enrich_youtube_items_replaces_body_for_an_unseen_youtube_item

      - id: enrich-skips-already-seen-guids
        given:
          seen: [g1]
        expect:
          body_md: "description only"
          reason: "seen guid must not trigger a fetch"
        covered_by: enrich_youtube_items_skips_fetch_for_already_seen_guids

      - id: enrich-cap-defers-excess-to-next-cycle
        given:
          unseen_youtube_items: ENRICH_CAP + 2
        expect:
          reason: "the unseen youtube item past the cap must be dropped, not just left unfetched"
          non_youtube: "non-youtube items are never capped"
        covered_by: enrich_youtube_items_drops_unseen_youtube_items_beyond_the_cap_but_keeps_non_youtube_items

      - id: enrich-fetch-failure-keeps-item-with-original-body
        given:
          fetch: error
        expect:
          reason: "original body must survive a fetch failure"
        covered_by: enrich_youtube_items_keeps_original_body_and_still_includes_the_item_when_fetch_fails

  - id: F-C08
    name: 유튜브 채널 해석 (채널 URL → RSS 피드 등록)
    status: shipped
    commands: commands/collect.yaml
    verify:
      rust: src-tauri/src/commands/collect.rs
      vitest: src/components/settings/CollectSection.test.tsx
    notes: 채널 구독은 kind='rss' + feeds/videos.xml 로 저장된다. /channel/UC…는 무네트워크 변환,
      @handle 등은 채널 페이지에서 channelId 추출(SSRF 가드 홉마다 재검증). 설정 UI의 "유튜브 채널"은
      UI 전용 의사 kind, collect_source_add_nl 의 채널형 youtube 초안도 저장 전 rss 로 재작성.
    cases:
      - id: channel-id-url-resolves-without-network
        given:
          url_prefix: "https://www.youtube.com/channel/"
        expect:
          feed_url_prefix: "https://www.youtube.com/feeds/videos.xml?channel_id="
        covered_by: resolves_a_channel_id_url_without_any_network_call

      - id: channel-page-inline-json-yields-channel-id
        given:
          html: inline ytInitialData JSON
        expect:
          channel_id: "UC_x5XG1OV2P6uZZ5FSM9Ttw"
        covered_by: extract_channel_id_finds_the_inline_json_channel_id

      - id: already-resolved-feed-url-is-idempotent
        given:
          url: feed url itself
        expect:
          feed_url: "https://www.youtube.com/feeds/videos.xml?channel_id=UC_x5XG1OV2P6uZZ5FSM9Ttw"
        covered_by: an_already_resolved_feed_url_is_returned_unchanged

      - id: nl-channel-draft-rewritten-to-rss
        given:
          kind: youtube
          url: channel-shaped
        expect:
          rewritten_kind: rss
          single_video_untouched: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
        covered_by: rewrite_converts_a_channel_shaped_youtube_draft_to_rss

      - id: ui-channel-type-resolves-then-creates-rss
        given:
          form_kind: youtube_channel
        expect:
          command: collect_resolve_youtube_channel
        covered_by: "saving a youtube channel source resolves the feed url first, then creates it as kind=rss"

  - id: F-C09
    name: 수집 후처리 제안 소비 (카드 → organize propose)
    status: shipped
    commands: commands/suggestions.yaml
    verify:
      vitest:
        - src/plugins/pet/bridge/petSuggestionCards.test.ts
        - src/plugins/pet/bridge/petCollectBridge.test.ts
    notes: collect_post_process 제안이 펫/사이드바 카드로 렌더되고, 수락 시 기존 organize 계약
      (ai_organize_note origin="collect_post_process" → AiConfirmModal → ai_apply_organize)이
      그 노트에 대해 실행된다. 미지의 kind 는 overlap 폴백 대신 스킵(자기병합 카드 사고의 수리).
      Rust 쪽 origin 감사·통계 배선은 tests/invariant_ai_history_audit.rs 가 커버.
    cases:
      - id: collect-suggestion-parses-into-card
        given:
          kind: collect_post_process
          payload: source_name + post_process_model
        expect:
          noteTitle: "회의록"
          sourceName: "업무 메일함"
        covered_by: "parses a valid collect_post_process suggestion into a 'collect' card"

      - id: unknown-kind-skipped-not-overlap-fallback
        given:
          kinds: [some_future_kind, overlap]
        expect:
          skipped_kind: "some_future_kind"
        covered_by: "skips a future/unknown kind entirely instead of falling back to overlap"

      - id: accept-runs-organize-with-origin-and-model
        given:
          action: accept collect card
        expect:
          origin: "collect_post_process"
          guidance: "GUIDANCE"
        covered_by: "runs accept -> select note -> organize in order, with metadata guidance/silent=false/origin/model"

      - id: accept-failure-still-refreshes-pet-badge
        given:
          accept: fails
        expect:
          event: "pet-suggestions-refresh"
        covered_by: "still requests a refresh even if the underlying accept fails — badge must not go 60s stale"

  - id: F-C11
    name: 챗봇 경유 수집 소스 등록
    status: shipped
    commands: commands/collect.yaml
    verify:
      rust:
        - src-tauri/src/repo/pet/mod.rs
        - src-tauri/src/commands/collect.rs
      vitest: src/lib/chatPipeline.test.ts
    notes: pet_chat의 add_collect_source 액션은 URL/kind 판정을 다시 하지 않고 collect_source_add_nl을
      그대로 재사용한다(lib/chatPipeline.ts). collect_chat_register 킬스위치(기본 OFF) + allow_write가
      둘 다 켜져야 실제 IPC가 나간다 — repo/pet/mod.rs 쪽은 액션을 라벨링만 하고 아무것도 쓰지 않는다.
      browser_history로 등록될 때는 local_kind_draft가 프로필을 특정하지 않으므로(항상 기본
      "Default"), collect_source_add_nl이 등록 직전에 detect::detect_candidates로 그 브라우저의
      후보를 훑어 pick_most_active_profile로 최근 방문이 가장 많은 프로필을 고른다(F-C15의 감지
      로직 재사용, 동률·후보 없음은 "Default"로 폴백해 오늘과 같은 실행 시점 에러를 유지).
    cases:
      - id: chat-add-collect-source-labeled-not-executed
        given:
          action: add_collect_source
          text: "https://example.com/feed 매일 등록해줘"
        expect:
          reply: "https://example.com/feed 매일 등록해줘"
          fallback: "수집 소스 등록을 시도할게요."
        covered_by: add_collect_source_action_touches_nothing_and_echoes_the_models_text

      - id: chat-add-collect-source-gated-by-two-flags
        given:
          action: add_collect_source
          gates: [collect_chat_register, allow_write]
        expect:
          command: collect_source_add_nl
          input: "https://example.com/feed 등록해줘"
        covered_by: "calls collect_source_add_nl with the raw user text when both gates are on"

      - id: chat-browser-history-picks-the-most-active-profile
        given:
          candidates: ["chrome:Default (3)", "chrome:Work (10)", "edge:Default (50)"]
          browser: chrome
        expect:
          picked_key: "chrome:Work"
        covered_by: pick_most_active_profile_prefers_the_highest_recent_count

