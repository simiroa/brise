# 커맨드 계약: sections (에디터 탭) — 규약: _conventions.yaml
commands:
  section_create:
    input:  { note_id: uuid, name: "string|omit=Section N" }
    output: Section
    errors: [NOT_FOUND]

  section_create_with_body:       # AI 드롭다운(정리/프롬프트)의 결과를 새 탭으로 넣을 때 사용
    input:  { note_id: uuid, name: "string|omit=Section N", body_md: string,
              kind: "'text'|'diagram'|'sheet'|omit=text", ai_origin: "string?" }
    output: Section
    errors: [NOT_FOUND, VALIDATION]   # VALIDATION: kind가 'text'/'diagram'/'sheet' 외의 값
    agent:
      kind: write
      description: "노트에 마크다운 본문을 가진 새 섹션(탭)을 추가한다."
      args:
        note_id: "섹션을 추가할 대상 노트 id (note_create 또는 검색 등으로 얻은 id)"
        name: "새 섹션의 이름/탭 제목"
        body_md: "섹션의 마크다운 본문 내용"
      hide: [kind, ai_origin]
    notes: |
      section_create와 동일하되 본문을 빈 문자열이 아니라 body_md로 채워 만든다. 존재 이유:
      commands/ai.yaml의 ai_cleanup_text/ai_generate_from_prompt는 절대 기존 섹션을
      덮어쓰지 않는다는 불변식을 지키므로, 그 결과는 항상 이 커맨드로 만든 새 탭에 들어간다
      (기존 section_create → section_update 2단계로도 같은 결과를 만들 수 있지만, 프론트가
      "빈 탭이 잠깐 보였다가 채워지는" 중간 상태 없이 한 번의 커맨드로 완성된 탭을 받도록
      단일 커맨드로 제공한다).
      kind(additive, migration v26): 다이어그램(관계도) 섹션 생성 전용 확장 — EditorPanel의
      "+" 새 섹션 피커가 "관계도"를 고르면 여기로 mermaid 스타터 소스를 body_md에 실어 보낸다.
      생략 시 'text'(기존 동작 그대로). 'diagram' 섹션의 body_md는 mermaid 소스 텍스트이지
      HTML이 아니다 — Tiptap/mdSerialize 경로를 절대 타지 않는다(src/components/diagram 참고).
      kind 'sheet'(additive, migration v57): 시트 섹션. body_md는 시트 JSON 한 덩어리다
      (specs/features/sheet.md §body_md JSON 스키마 v1). 마찬가지로 Tiptap 경로를 타지 않는다.

  sheet_set_cells:                # 시트 셀 패치 — AI "시트 수정하기" · 모바일 단일 셀 편집 공용
    input:  { section_id: uuid, cells: "map<string, json>" }
    output: { updated_at: timestamp, section_updated_at: timestamp }   # updated_at = notes.updated_at 전파, section_updated_at = 섹션 버전 토큰(section_update 참조)
    errors: [NOT_FOUND, VALIDATION]   # NOT_FOUND: 섹션 없음 · 노트가 휴지통
    notes: |
      cells는 CellPatch — 키는 A1 표기(^[A-Z]{1,2}[1-9][0-9]*$), 값은
      { raw: string|null, fmt?: string, dp?: integer, cur?: string }. raw가 null이면 그 셀을
      지우고, 그렇지 않으면 raw를 세팅한 뒤 함께 온 fmt/dp/cur만 덮어쓴다(생략된 키는 기존 값
      유지). TS 쪽 정확한 타입은 src/lib/sheet/types.ts::CellPatch — DSL의 map<string,json>은
      Rust dispatch가 serde_json::Value로 받게 하려는 것이고, 값 모양 검증은 repo/sheet.rs가 한다.
      VALIDATION: 섹션 kind가 'sheet'가 아님 · body_md가 유효한 시트 JSON이 아님 · 키가 A1이 아님.
      쓰기는 section_update와 같은 repo::sections::update 경로를 타므로 updated_at 전파 ·
      FTS upsert · events::publish가 정확히 한 번, 같은 자리에서 일어난다.

  section_update:                 # 본문 자동 저장 경로 (프론트 700ms 디바운스)
    input:  { id: uuid, name: "string?", body_md: "string?", ai_origin: "string?", expected_updated_at: "timestamp?" }
    output: { updated_at: timestamp, section_updated_at: timestamp }   # updated_at = notes.updated_at 전파, section_updated_at = 이 섹션의 새 버전 토큰
    errors: [NOT_FOUND, CONFLICT]   # NOT_FOUND: 섹션 없음 · 노트가 휴지통. CONFLICT: expected_updated_at 불일치(쓰지 않음)
    notes: |
      FTS upsert (동일 트랜잭션).
      낙관적 동시성 (D2②, docs/PLAN-2026-10-06-d2-expected-updated-at.md): expected_updated_at 은
      클라이언트가 마지막으로 본 sections.updated_at(note_get 의 sections[].updated_at 또는 직전
      쓰기 응답의 section_updated_at). 다르면 CONFLICT 이고 아무것도 쓰지 않는다 — 판정과 쓰기가
      한 트랜잭션. 생략하면 기존 동작(마지막 쓰기 승리, 단계 1). 토큰은 단조 증가
      (max(now, prev+1ms))라 같은 밀리초 두 쓰기도 서로 다른 토큰을 받는다. 노트의 updated_at 을
      토큰으로 쓰지 말 것 — 태그·상태 쓰기에도 올라 거짓 충돌이 난다.
      무변경 쓰기(2026-10-18): body_md 가 저장값과 같고 name·ai_origin 도 행을 바꾸지 않으면 아무것도 쓰지
      않고 **현재** updated_at·section_updated_at 을 돌려준다 — 노트 수정 시각·활동 기록 '편집'·FTS·토큰·변경
      이벤트 모두 그대로. expected_updated_at 이 어긋나도 같다(감사 M-8 — 응답만 잃은 저장의 재전송은 이미
      반영된 쓰기). 예외: 토큰을 보낸 휴지통 노트 쓰기는 그대로 NOT_FOUND, 토큰이 없는 구형 행은 예전처럼 쓴다.
      ai_origin 세 갈래 계약 (additive, migration v67 —
      docs/PLAN-2026-08-30-ai-surface-and-clients.md W5). **본문을 쓰는 사람이 누구인지**를
      이 한 커맨드가 판정한다:
        1. body_md 생략            → ai_origin 을 건드리지 않는다 (탭 이름만 바꾼 경우 —
                                     rename 은 저작이 아니다).
        2. body_md 있음 + ai_origin 생략 → ai_origin 을 NULL 로 지운다. 사용자가 손댔으므로
                                     그 섹션은 이제 사용자의 글이다. 프론트 자동 저장
                                     (stores/notes.ts::updateSectionBody 디바운스)이 이 갈래다.
        3. body_md 있음 + ai_origin 있음 → 그 값으로 세팅한다. AI 가 **기존** 섹션을 다시 쓰는
                                     유일한 경로(diagram_edit — "기존 관계도 수정")가 이 갈래다.
                                     새 섹션은 section_create_with_body 를 탄다.
      2번이 기본값인 것이 핵심이다 — 표식을 지우는 책임을 호출자에게 흩지 않고, 모든 본문
      쓰기가 지나가는 이 한 지점에서 판정한다(.claude/CLAUDE.md 코드 방침: 증상 위치에 가드를
      덧대지 말고 모든 호출자가 지나가는 지점에서 한 번).
      sheet_set_cells 는 repo::sections::update 를 타지만 시트 셀 패치이므로 ai_origin 을
      건드리지 않는다(시트에는 AI 산출물 표식을 붙이지 않는다 — 이번 웨이브 범위 밖).

  section_import_file:            # 파일 하나 → 새 섹션 (편집기 본문 드롭 · 타이틀 "…" 메뉴 다중 선택)
    http: false   # file_path는 OS 드래그&드롭/파일 다이얼로그가 준 로컬 경로 — 원격 클라이언트엔 의미 없음
    input:  { note_id: uuid, file_path: string }
    output: { sections: "Section[]", truncated: boolean }
    errors: [NOT_FOUND, VALIDATION, IO]   # VALIDATION: 지원하지 않는 확장자 · 디렉터리 · 추출 텍스트 0
    notes: |
      확장자로 파서를 고르고 결과를 section_create_with_body 와 **같은 repo 함수**
      (sections::create_with_body_and_kind_and_origin, ai_origin=None)에 넘긴다 — 새 섹션 생성
      경로를 두 벌로 만들지 않는다. 섹션 이름은 파일 stem(확장자 제외), 빈 stem 이면 기본 이름.

      확장자 → kind/파서 (specs/service/extraction.yaml 이 추출기 SSOT):
        md · txt        → text   : 파일 내용 그대로(마크다운으로 해석됨)
        docx · pdf      → text   : extraction::extract_markdown 재사용(평문, 서식 손실)
        hwpx            → text   : extraction::extract_hwpx (zip + quick-xml, docx 파서와 같은 꼴)
        pptx            → text   : extraction::extract_pptx (zip + quick-xml, 슬라이드당 ## Slide N 헤딩)
        csv · tsv       → sheet  : 표 → 시트 JSON v1 (specs/features/sheet.md 스키마)
        xlsx            → sheet  : 워크시트 **한 장당 섹션 하나**. 섹션 이름은 워크시트 이름
                                   (빈 이름이면 파일 stem). 이것이 output 이 배열인 이유다 —
                                   나머지 형식은 항상 길이 1 이다.
        그 외            → VALIDATION. hwp(바이너리 5.0)는 포맷 복잡도 대비 가치가 낮아 영구 기각.

      디렉터리 경로는 VALIDATION 이다 — 폴더를 펼치는 일은 section_import_scan 이 맡는다.
      (이 가드가 없던 동안 폴더 드롭이 첨부 경로로 새어 뜻 모를 IO 오류로 끝났다.)

      xlsx 규칙:
        - 값을 가져온다. **수식 문자열이 아니라 계산된 값**이다 — 우리 수식 엔진의 함수 집합이
          엑셀과 달라 수식을 그대로 옮기면 조용히 다른 값을 내기 때문(specs/features/sheet.md).
        - 날짜 셀은 ISO(YYYY-MM-DD) 로, 그 밖은 표시 문자열 그대로. 빈 셀은 키를 만들지 않는다.
        - 시트 상한(1000행 × 52열)은 CSV 와 같은 규칙으로 절단 + truncated=true.
        - 워크시트가 전부 비어 있으면 그 시트는 건너뛴다. 전부 비면 VALIDATION.

      CSV/TSV 규칙:
        - 구분자는 확장자로 결정한다(csv=',' · tsv='	'). 추측하지 않는다.
        - RFC 4180 따옴표 규칙(큰따옴표 감싸기 · "" 이스케이프 · 셀 안 개행). 내보내기
          (src/lib/sheet/csv.ts::escapeCsvCell)와 왕복 대칭이어야 한다.
        - 인코딩: UTF-8 우선, BOM 제거. UTF-8 디코딩 실패 시 CP949 폴백(엑셀 한국어 저장본).
          폴백은 조용히 한다 — 사용자가 할 수 있는 일이 없다.
        - 셀 값은 raw 문자열 그대로 들어간다. '=' 로 시작하는 셀은 시트에서 수식이 된다
          (외부 TSV 붙여넣기 lib/sheet/projection.ts::fromTsv 와 같은 관례).
        - 상한 초과(1000행 × 52열, SHEET_LIMITS)는 거부가 아니라 절단 + truncated=true.
          프론트가 토스트로 알린다.

      truncated 는 CSV/TSV 절단에만 true 다. 텍스트 추출의 1MB cap(extract_markdown 내부)은
      기존 source_add_file 과 동일하게 조용히 자른다 — 이 플래그를 쓰지 않는다.

  doc_import_html:                # 문서 파일 → 서식 있는 HTML (PLAN-2026-10-07-doc-import-export W1 hwpx · W4 docx)
    http: false   # file_path 는 로컬 경로 — section_import_file 과 같은 이유
    input:  { note_id: uuid, file_path: string }
    output: { name: string, html: string, image_count: integer, dropped: "DocImportDropped[]", attachment_ids: "string[]" }
    errors: [NOT_FOUND, VALIDATION, IO]   # VALIDATION: hwpx·docx 아님 · 암호화·옛 .doc · 본문 없음 · 크기 상한 · DOCX DOCTYPE
    notes: |
      섹션을 **만들지 않는다.** 프런트가 html 을 mdSerializeHtml(붙여넣기와 같은 스키마 관문)로 body_md 로
      바꿔 section_create_with_body 로 넣는다 — 마크다운 직렬화 규칙을 Rust 에 두 번째로 두지 않기 위해서다.
      실패하면 프런트는 section_import_file(텍스트 추출)로 물러난다.

      부작용: 본문 그림(BinData)을 note_id 의 첨부로 저장하고(attachments::add_file), html 의
      <img data-rel-path> 가 그 rel_path 를 가리킨다. 섹션 생성이 뒤에 실패해도 첨부는 남는다.

      html 은 Brise 스키마가 parseHTML 로 아는 부분집합만 쓴다: p/h1~h3(정렬·들여쓰기 data-brise-*),
      strong/em/u/s/mark/span style=color, a href, ul/ol(start — docx 가 끊긴 번호 목록의 이어 세기를 싣는다)/li, table(th/td colspan·rowspan·colwidth·
      background-color), img(data-rel-path, style width %), br, pre/code.
      name = 파일 stem. dropped = 옮기지 못한 요소의 종류별 개수(본문은 담지 않는다).

  section_import_scan:            # 드롭/다중선택 경로 펼치기 — 폴더를 가져올 수 있는 파일 목록으로
    http: false   # 로컬 경로 인자
    input:  { paths: "string[]" }
    output: { files: "string[]", skipped: integer }
    notes: |
      드롭 payload 나 파일 다이얼로그가 준 경로 목록을 section_import_file 이 바로 먹을 수 있는
      **파일 경로 목록**으로 바꾼다. 파일은 지원 확장자면 그대로 통과, 디렉터리는 그 안을 훑어
      지원 확장자만 담는다. 프런트가 파일시스템을 못 읽으므로(플러그인 없이) 이 한 왕복이 필요하다.

      규칙:
        - 재귀 탐색, 최대 깊이 8. 심볼릭 링크는 따라가지 않는다(순환 방지).
        - 결과는 경로 오름차순 정렬 — 섹션이 만들어지는 순서가 매번 같아야 한다.
        - 상한 200개. 넘으면 앞의 200개만 담고 나머지는 skipped 에 센다.
        - skipped = 지원하지 않아 버린 것 + 상한 초과분 + **못 읽은 경로**(사라졌거나 권한 없음).
          개별 경로의 IO 실패는 치명적이지 않다 — 폴더 하나가 안 읽힌다고 드롭한 파일 전부를
          버리면 실패해도 나머지는 계속하는 이 저장소의 배치 관례와 어긋난다. 그래서 이 커맨드는
          errors 가 없다(무엇을 넣든 파일 목록과 개수로 답한다). 프런트가 한 번에 알린다.
        - 숨김 파일/디렉터리(이름이 '.' 로 시작)는 건너뛴다.
      확장자 판정은 section_import_file 의 매트릭스와 **같은 목록 하나**를 써야 한다 — 두 벌로
      갈리면 스캔은 통과시키고 가져오기가 거부하는 상태가 생긴다.

  section_delete:                 # 마지막 남은 섹션은 삭제 불가 — 휴지통 경유
    input:  { id: uuid }
    output: { deleted: boolean }
    errors: [NOT_FOUND, CONFLICT]  # CONFLICT: 노트의 유일한 섹션
    notes: |
      docs/PLAN-2026-09-10-section-dnd-trash.md D4: 하드 삭제가 아니라 **휴지통 경유**다 — 같은
      트랜잭션에서 행을 section_trash 로 옮긴 뒤 sections 에서 지운다(별도 테이블인 이유는
      specs/db/schemas/content.sql section_trash 주석). 계약(입력·출력·CONFLICT)은 그대로다.
      tombstone(deleted_rows)은 계속 찍는다 — 동기화 상대에게 이 섹션은 사라진 게 맞다(복구는
      재생성으로 보인다). section_restore 가 그 tombstone 을 지운다.

  section_restore:                # 휴지통에서 복구 — 원 노트 맨 뒤로
    input:  { id: uuid }
    output: { ok: boolean }
    errors: [NOT_FOUND, CONFLICT]  # NOT_FOUND: 휴지통에 없음 / CONFLICT: 원 노트가 휴지통(또는 사라짐)
    notes: |
      같은 id 로 sections 에 되돌린다. position = 그 노트 MAX(position)+1(맨 뒤 — section_create·
      section_move 와 같은 규칙), updated_at=now, notes.updated_at 전파 + FTS upsert.
      원 노트를 먼저 복구해야 하는 경우(CONFLICT)는 UI 가 버튼을 비활성화하고 이유를 보여준다
      (section_trash_list 의 note_deleted).

  section_purge:                  # 휴지통 항목 완전 삭제
    input:  { id: uuid }
    output: { deleted: boolean }
    errors: [NOT_FOUND]
    notes: |
      section_trash 행만 지운다 — 섹션엔 딸린 파일이 없다(본문 이미지는 attachments 소유이고
      노트에 매달려 있다). 노트를 완전 삭제(note_purge)하면 FK CASCADE 로 그 노트의 휴지통
      섹션도 함께 사라진다.

  section_trash_list:             # 휴지통 화면 섹션 구역 데이터 소스
    input:  { workspace_id: "uuid|omit=active" }
    output: "SectionTrashEntry[]"
    notes: |
      노트북 소속 휴지통 섹션을 deleted_at desc 로 반환(note_trash_list 와 같은 관문).
      배지용 count 커맨드는 만들지 않는다 — 사이드바 배지는 노트 수만 센다(D4/§6 기본값).

  section_reorder:
    input:  { note_id: uuid, ordered_ids: "uuid[]" }
    output: { ok: boolean }
    errors: [NOT_FOUND, VALIDATION]  # ordered_ids가 해당 노트 섹션 집합과 불일치

  section_move:                   # 섹션을 다른 노트로 (탭 드래그 → 트리 노트 행 · 우클릭 "다른 노트로 이동")
    input:  { id: uuid, target_note_id: uuid }
    output: { ok: boolean }
    errors: [NOT_FOUND, CONFLICT]  # CONFLICT: 원 노트의 유일한 섹션 / NOT_FOUND: 섹션·대상 노트 없음(휴지통 포함)
    notes: |
      docs/PLAN-2026-09-10-section-dnd-trash.md D2. 섹션 행을 대상 노트로 옮긴다 — 복사도 삭제도
      아니므로 **tombstone 을 찍지 않는다**(행이 살아 있다). 동기화는 sections.updated_at 갱신으로
      전파된다.

      규칙:
        - 원 노트의 유일한 섹션이면 CONFLICT — section_delete 와 **같은 규칙**이다(빈 노트를
          만들지 않는다). 두 경로가 다른 답을 내면 안 된다.
        - target_note_id 가 원 노트와 같으면 no-op ok(드래그가 제자리에 떨어진 경우).
        - 대상 노트가 없거나 휴지통(deleted_at IS NOT NULL)이면 NOT_FOUND.
        - 한 트랜잭션: position = 대상 노트 MAX(position)+1(맨 뒤), 양쪽 notes.updated_at 갱신,
          양쪽 FTS upsert.
        - 원 노트의 position 은 압축하지 않는다 — section_reorder 가 매번 0..n-1 로 다시 매기고
          load_for_note 는 ORDER BY position 이라 구멍이 무해하다.
      본문 이미지 첨부는 함께 옮기지 않는다(천장·업그레이드 경로는 repo/sections.rs::move_to_note
      의 ponytail: 주석).

  # ── 섹션 분리 창(1단계, 2026-09-30) — src-tauri/src/section_window.rs ──────────────────────
  # 배타 소유: 분리 여부의 단일 진실 = `section-<id>` 창의 존재. DB·설정에 저장하지 않는다.
  # 열림/닫힘은 `section-window-changed { section_id, open }` 이벤트로 통지(닫힘은 창 Destroyed).
  # 분리 중인 섹션/노트가 삭제되면 events::publish 초크포인트가 그 창을 파괴한다.
  # 셋 다 OS 창을 여닫는 커맨드라 http:false(_conventions.yaml).
  section_window_open:            # 이미 있으면 앞으로 가져오기만(unminimize+show+focus)
    http: false
    input:  { note_id: uuid, section_id: uuid, title: string, x: "number?", y: "number?" }
    output: { opened: boolean }
    notes: |
      새 창은 `index.html?note=<note_id>&section=<section_id>#/section` 으로 열린다. 호출자(본 창)는
      열기 전에 flushAll 로 그 섹션의 미저장 편집을 먼저 내보낸다 — 새 창은 DB 에서 읽는다.
      x·y(2단계, 탭을 창 밖으로 끌어 놓기) = 놓은 화면 좌표(PointerEvent.screenX/Y, 논리 px).
      둘 다 있으면 커서가 새 창 제목줄 가운데쯤 오게 띄우고 그 모니터 작업 영역 안으로 붙잡는다.
      어느 모니터에도 안 걸리면 가운데. 이미 열린 창은 위치를 바꾸지 않고 앞으로 가져오기만 한다.

  section_window_close:           # 닫기 요청 — 창이 flushAll 후 스스로 destroy
    http: false
    input:  { section_id: uuid }
    output: { closed: boolean }    # false = 그 섹션의 창이 없었음

  section_window_list:
    http: false
    input:  {}
    output: { section_ids: "string[]" }

shared_types:
  # 휴지통 모달 섹션 구역의 행 하나. note_deleted = 원 노트가 휴지통에 있음 → 복구 비활성 + 이유.
  SectionTrashEntry: "{ id: uuid, name: string, kind: string, note_id: uuid, note_title: string, note_deleted: boolean, deleted_at: timestamp }"
  # doc_import_html 이 옮기지 못한 요소 한 종류. kind: header_footer · equation · shape · ole · chart · image_format ·
  # field · image_missing · image_limit · comment(docx 메모) · symbol(docx 기호 글꼴 글자) (프런트 라벨 맵 docImport.ts DROPPED_KIND_LABEL_KEYS — 모르는 kind 는 "기타").
  DocImportDropped: "{ kind: string, count: integer }"
