# 커맨드 계약: settings — 규약: _conventions.yaml
# 키 목록과 값 타입은 db/schemas/settings.sql 주석이 SSOT (진짜 SSOT 코드는
# src-tauri/src/db/migrations.rs::validate_setting). 프론트가 이 목록에 없는 키로 settings_set 을
# 호출하면 VALIDATION 으로 조용히 거부된다 — scripts/check-settings-keys.mjs 가 CI 에서 이 드리프트를
# 잡는다 (specs/tests/invariant-settings-keys.yaml).
commands:
  settings_get_all:
    input:  {}
    output: { settings: "map<string, json>" }   # 미설정 키는 기본값 채워서 반환

  settings_set:                                 # http:true (기본) — 단, sync_* 키는 예외
    input:  { entries: "map<string, json>" }    # 부분 업데이트 (제공 키만)
    output: { ok: boolean }
    errors: [VALIDATION]                        # 알려지지 않은 키(허용 목록 밖) / 타입·범위 위반
    notes: |
      http:false로 표시하지 않는다(설정 CRUD는 원격 클라이언트에 유용) — 대신 sync_enabled/
      sync_token/sync_port(sync_* 접두사 전부)는 POST /api/v1/invoke 핸들러가 entries를 검사해
      별도로 400 거부한다(src-tauri/src/sync_server/handlers/invoke.rs). 이 커맨드가 그냥
      http:true였다면 sync_set_enabled/sync_regenerate_token을 http:false로 막은 의미가
      settings_set 한 번으로 우회되기 때문 — docs/CLIENT-RULES.md §2 "서버 lifecycle" 예외
      클래스의 일부. 다른 모든 키(테마, ai_provider, 사이드바 프리셋 등)는 그대로 원격에서 설정
      가능하다.

  # 모양(테마) 10개 키만 — docs/PLAN-2026-09-19-theme-presets.md. 셋 다 쓰지 않는다: 읽은 값은
  # 프런트가 settings_set 한 번으로 쓴다(쓰기 초크포인트 유지). 키 목록 SSOT =
  # repo/settings_schema.rs::APPEARANCE_KEYS.
  theme_defaults:
    http: false
    input:  {}
    output: { entries: "map<string, json>" }    # default_settings 를 모양 키로 거른 것

  theme_read:
    http: false                                 # local filesystem only
    input:  { path: string }
    output: { entries: "map<string, json>", skipped_unknown: integer, source: string }
    errors: [VALIDATION, IO]
    notes: |
      brise-theme v1 파일 또는 전체 내보내기 번들(brise-bundle.json)에서 모양 키만 뽑는다.
      모르는 키는 건너뛰고 skipped_unknown 에 센다(번들은 0). 아는 키의 값이 틀리면 파일 전체
      VALIDATION. 모양 키가 하나도 없거나 형식 버전이 더 새것이어도 VALIDATION. source = theme|bundle.

  theme_export:
    http: false                                 # local filesystem only
    input:  { path: string }
    output: { ok: boolean }
    errors: [IO]

  db_stats:                                     # 설정 "데이터" 통계 카드 — 노트/첨부 수, 사용 일수, 용량
    input:  {}
    output: { note_count: integer, attachment_count: integer, distinct_note_days: integer,
              db_size_bytes: integer, attachments_size_bytes: integer, image_size_bytes: integer,
              disk_free_bytes: "integer|null" }
    notes: |
      distinct_note_days = COUNT(DISTINCT date(notes.created_at)) — "사용 N일". attachments_size_bytes/
      image_size_bytes 는 data_dir/attachments/ 파일시스템 walk(repo/settings.rs::dir_sizes).
      disk_free_bytes 는 data_dir 이 있는 볼륨의 여유 공간(fs4::available_space); OS 호출 실패 시 null.

  phrase_packs_list:                            # Wave 8 header — user phrase packs under data_dir/phrase_packs/
    http: false                                 # local filesystem only
    input:  {}
    output:
      packs: "{ id: string, name: string, items: { text: string, source: string? }[] }[]"
    notes: |
      Scans $APPDATA/phrase_packs/*.json with schema { name, items:[{ text, source? }] }.
      Invalid files soft-skipped (stderr warn). Creates the folder if missing.

  phrase_pack_save:                             # AI 생성 헤더 문구 팩 저장 — data_dir/phrase_packs/<slug>.json
    http: false                                 # local filesystem write (phrase_packs_list 와 같은 클래스)
    input:  { name: string, items: "{ text: string, source: string? }[]" }
    output: { id: string, file_name: string }
    errors: [VALIDATION, IO]
    notes: |
      파일명은 name 을 화이트리스트(문자·숫자·'_')로 걸러 만든 slug — '.', '/', '\' 는 통과 자체가
      불가능해 '..'/절대경로/트래버설이 구조적으로 성립하지 않는다. 같은 slug 가 이미 있으면
      "-2", "-3"... 을 붙여 덮어쓰지 않는다. 반환 id 는 phrase_packs_list 가 주는 것과 같은
      "user:<file_name>" 이라 그대로 settings.phrase_pack_id 에 넣을 수 있다.
      한계: name ≤80자, items 1~200개, text ≤300자, source ≤120자 (초과 시 VALIDATION).
