# 커맨드 계약 공통 규약 (모든 commands/*.yaml에 적용 — 각 파일에서 중복 기술 금지)
conventions:
  transport: tauri-invoke                  # invoke(name, input) -> output | throws AppError
  naming: snake_case                       # 커맨드명 = {entity}_{verb}
  id_type: { type: string, format: uuid }
  timestamp: { type: string, format: iso8601-utc }
  error_shape: { code: "NOT_FOUND|VALIDATION|CONFLICT|IO|DB", message: string }
  errors_implicit: [DB]                    # 모든 커맨드는 DB 에러 가능 — 개별 명세 생략
  typegen: "specs/commands/*.yaml → src/lib/commands.gen.ts (스크립트 생성, 수동 편집 금지)"
  # http 플래그 (sync-readiness): 커맨드가 sync_server의 POST /api/v1/invoke 로 원격(웹/모바일)
  # 클라이언트에서도 호출 가능한지. 생략 시 기본값 true. 이 플래그가 있는 커맨드는
  # scripts/gen-commands.mjs 가 동시에 src-tauri/src/sync_server/dispatch.gen.rs 의 match arm도
  # 생성한다(http:true 커맨드만). http:false 로 표시해야 하는 부류(docs/CLIENT-RULES.md §2 영구
  # 규칙과 동일):
  #   - OS UI/다이얼로그를 여는 커맨드 (attachment_open/reveal, data_dir_open)
  #   - 로컬 파일시스템 경로 인자를 받는 커맨드 (file_path/dest_path/dest_dir/source_dir/zip_path/
  #     bundle_path/enex_path — 데스크톱 파일 다이얼로그가 고른 경로는 원격 클라이언트에 의미 없음)
  #   - 파괴적이거나 서버 머신 로컬 상태에 부수효과가 있는 관리 동작 (db_reset, backup_restore,
  #     backup_auto_run)
  #   - 네이티브 하드웨어를 잡는 커맨드 (dictation_* — 서버 머신의 실물 마이크)
  #   - 서버 자신의 lifecycle을 제어하는 커맨드 (sync_set_enabled, sync_regenerate_token — 원격
  #     클라이언트가 자신이 붙어있는 서버를 끄거나 토큰을 재발급할 수 없어야 함)
  #   - 생성기가 표현할 수 없는 예외적 시그니처 (예: State 파라미터가 두 개 이상인 커맨드)
  # reads/CRUD(노트·태그·폴더·워크스페이스·설정)는 기본값 true 그대로 둔다 — 개별 플래그 생략.

shared_shapes:
  NoteSummary:      # 트리/검색 결과 행
    { id: uuid, folder_id: uuid, title: string, year: integer,
      is_favorite: boolean,
      # 더보기 메뉴 "내용잠금"(용어집: "내용"=섹션/본문) — true면 섹션 추가/삭제 + 본문 편집이
      # 금지된다. Rust 쪽은 항상 채워 보낸다(is_favorite와 정확히 같은 구조, V84) — TS만
      # region_names와 같은 이유로 optional로 둔다: 이 필드를 모르는 기존 NoteSummary 테스트
      # 픽스처(수십 곳)가 전부 깨지지 않게. 프런트에서 읽을 때는 `note.content_locked` (falsy 취급).
      content_locked?: boolean,
      exported_at: "timestamp|null", has_image: boolean,
      tag_names: "string[]",
      # Wave 12: 사이드바 "Région" 필터 축 — 태그와 달리 노트당 정확히 하나의 값(1급 필드).
      # 자유 텍스트, null = 미설정. 프리셋별 선택지는 src/lib/eras.ts::EraPreset.regions(UI 힌트).
      region: "string|null",
      # D4/N2-2: region(대표) ∪ note_regions(경유지) 합집합 — note_query 서버측 RegionFilterSpec
      # 과 동일한 매칭 규칙을 클라 후처리 필터(검색 칩 경로)도 쓸 수 있게 노출. **오직**
      # repo::notes::note_summaries_map(검색/related 배치 경로)만 실제로 채운다 — 트리/맵/달력처럼
      # note_query 를 직접 타는 경로는 서버가 이미 합집합으로 필터링해 반환하므로 이 필드가
      # 필요 없다(다른 생성 경로는 []). Rust 쪽은 항상 채워 보낸다(Vec<String>, 절대 생략 안 함) —
      # TS 만 `snippet` 과 같은 이유로 optional 로 둔다: 이 필드를 모르는 기존 NoteSummary 테스트
      # 픽스처(수십 곳)가 전부 깨지지 않게. src/components/leftpanel/notetree/filtering.ts 참고.
      region_names?: "string[]",
      # Wave 15: 노트 진행 상태 축 — 내장 키("in_progress"|"exported"|"done") 또는
      # workspace_statuses.id, null = 미설정. commands/workspaces.yaml 의 workspace_status_*.
      status: "string|null",
      # 노트 아이콘 키 — src/lib/noteIcons.ts NOTE_ICONS[].key, null = 기본(note) 아이콘.
      icon: "string|null",
      # Wave 6a: 노트 좌표 — lat/lng REAL/f64 NULL, null = 미설정.
      # 스펙 DSL 에 부동소수 타입이 없어 number 로 적는다(geocode.yaml 과 동일 관례). DB REAL, Rust f64.
      lat: "number|null",
      lng: "number|null",
      # 달력(기록 축) 준비: notes.created_at/updated_at 노출 — year(사건 축)와 달리 둘 다 NOT NULL
      # (ISO8601 UTC), 입력 비용 0으로 항상 채워진다.
      created_at: timestamp,
      updated_at: timestamp,
      # Wave (event precision, §2.3): year 위의 선택적 세분화. null/null=연도만, month만=연월,
      # 둘 다=연월일. day가 있으면 month도 있다(전용 커맨드가 강제).
      month: "integer|null",
      day: "integer|null",
      # Dashboard Wave 2 (docs/DASHBOARD.md §2, 2026-08-01): 사건 축 기간 종료. null 트리플 =
      # 단일 시점. end_day⇒end_month⇒end_year. 마감 축(due_at)은 폐지되어 이 축으로 흡수됐다 —
      # "기간의 끝 = 처리 기한", 같은 개념을 두 필드로 두지 않는다(db/migrations.rs V29_SQL).
      end_year?: "integer|null",
      end_month?: "integer|null",
      end_day?: "integer|null",
      # Dashboard Wave 3 (docs/DASHBOARD.md §2, 2026-08-01): 노트별 "알려줘" opt-in 플래그. 마감/
      # 긴급도 표시 규칙은 폐지 — remind=true 이고 종료일이 풀 정밀도로 과거일 때만 칸반 핀 +
      # 빨간 점 효과가 있다(완료 컬럼 제외, repo::dashboard 판정). 날짜 없이 켜져 있어도 무효과.
      # Rust 쪽은 항상 채워 보낸다(bool, 절대 생략 안 함) — TS 만 end_year 등과 같은 이유로
      # optional 로 둔다: 이 필드를 모르는 기존 NoteSummary 테스트 픽스처(수십 곳)가 전부 깨지지
      # 않게(region_names/snippet 주석과 동일 관례). 프론트 실사용 코드는 `note.remind` 를
      # falsy-safe 하게 읽는다(board/status.ts::isPinned 의 `!note.remind` 가 undefined 도 false
      # 취급).
      remind?: boolean,
      # docs/PLAN-schedule-system.md §1.2/§1.3 (W5-1): 일정 시각·알림 오프셋·반복(RRULE 서브셋
      # 원문). start_time/end_time 은 "HH:MM"(로컬), null=미설정. remind_offset_min 은 몇 분 전에
      # 알릴지(0..40320, null=정시). rrule 은 §3 서브셋 문자열 원문, null=반복 없음 — 이 웨이브는
      # 저장/왕복만 하고 문법 검증(I5)은 하지 않는다(관문은 repo::schedule::rrule::parse, W5-2).
      # optional인 이유는 region_names/snippet/end_year 등과 동일 — 이 필드들을 모르는 기존
      # NoteSummary 테스트 픽스처가 전부 깨지지 않게. Rust 쪽은 항상 채워 보낸다(Option<T>, 절대
      # 생략 안 함). rrule_parts(파싱된 구조체, §3.3)는 아직 싣지 않는다 — repo::schedule 모듈이
      # 이 웨이브 소유가 아니라 파서 타입이 없다(W5-2 landing 이후 그 계약을 쓰는 웨이브가 추가).
      start_time?: "string|null",
      end_time?: "string|null",
      remind_offset_min?: "integer|null",
      rrule?: "string|null",
      # Wave 4: 검색 매치 본문 스니펫 (\u0002/\u0003 마커 포함). 검색 이외(폴더 목록 등)에서는 null/생략.
      snippet?: "string|null" }
  NoteDetail:       # NoteSummary + 하위 콘텐츠 전체
    { note: NoteSummary, sections: "Section[]", sources: "Source[]",
      attachments: "Attachment[]" }
  # kind (additive, migration v26): 'text' = Tiptap prose (historical default), 'diagram' =
  # mermaid source text (body_md — never HTML, never touches the Tiptap/mdSerialize path). See
  # commands/sections.yaml#section_create_with_body and db/schemas/content.sql.
  # ai_origin (additive, migration v67 — docs/PLAN-2026-08-30-ai-surface-and-clients.md W5):
  # 이 섹션이 AI 산출물이면 그 액션 id(summarize|organize|list|translate|diagram|diagram_edit|
  # 커스텀 프리셋 id), 사용자가 직접 쓴 섹션이면 null. "AI supported note" 를 데이터로 남기는
  # 유일한 필드다 — SavedState 의 "ai_organized" 는 저장 인디케이터의 휘발성 값일 뿐 노트에
  # 남지 않는다. 쓰는 지점은 src/lib/aiSectionBridge.ts::insertAiSection 한 곳(모든 text/diagram
  # 결과가 지나가는 관문, docs/AI.md §2.1). 사용자가 그 섹션 본문을 고치면 지워진다(= 내 글이
  # 된다) — section_update 의 세 갈래 계약을 볼 것.
  # optional 인 이유는 region_names/snippet/end_year 와 동일 — 이 필드를 모르는 기존 Section
  # 테스트 픽스처가 전부 깨지지 않게. Rust 쪽은 항상 채워 보낸다(Option<String>, 절대 생략 안 함).
  # updated_at (migration v24 부터 DB 컬럼으로 존재했으나 이 shape 에는 빠져 있었다 —
  # W5(2026-08-30) 가 ai_origin 툴팁("AI가 만든 섹션 · {액션} · {날짜}")에 쓰려다 발견해 정식
  # 편입했다. NoteSummary.updated_at 과 같은 의미(ISO8601 UTC, NOT NULL). Rust 는 항상 채워
  # 보내지만 TS 만 optional 로 둔다 — 이 필드를 모르는 기존 Section 테스트 픽스처가 깨지지 않게
  # (region_names/snippet/end_year 와 동일 관례).
  Section:    { id: uuid, name: string, body_md: string, position: integer, kind: "'text'|'diagram'|'sheet'",
                ai_origin?: "string|null", updated_at?: "string|null" }
  # truncated: 본문이 추출 상한(1MB)에 걸려 뒷부분이 잘렸는지(DB sources.truncated, v81).
  # 잘린 사실은 데이터라 행에 남기고, 문구는 프런트가 로케일대로 고른다. Rust 는 항상 채워
  # 보내지만 TS 만 optional — 이 필드를 모르는 기존 Source 픽스처 보호(ext_path 와 같은 관례).
  Source:     { id: uuid, name: string, ext: string, body: string, position: integer,
                truncated?: boolean }
  Attachment: { id: uuid, name: string, kind: "image|doc|link|audio|note|internal|chart",
                rel_path: "string|null", url: "string|null",
                # 참조 첨부(복사하지 않고 앱 폴더 밖 원본을 가리키는 파일 첨부)의 절대경로.
                # rel_path 와 배타 — 파일 첨부는 둘 중 정확히 하나를 갖는다(db V80_SQL).
                # Rust 는 항상 채워 보낸다(Option<String>). TS 만 optional 로 둔다 —
                # region_names/end_year 와 같은 이유(이 필드를 모르는 기존 픽스처 보호).
                ext_path?: "string|null",
                size_bytes: "integer|null", position: integer,
                # 오디오 전사(V93, commands/transcribe.yaml) — 서버가 첨부 행에 보관, 클라이언트가 본문에 삽입.
                # Rust 는 항상 채워 보낸다. TS 만 optional(ext_path 와 같은 이유 — 기존 픽스처 보호).
                transcript?: "string|null", transcript_inserted?: boolean }
  Folder:     { id: uuid, workspace_id: uuid, name: string, position: integer,
                is_open: boolean, note_count: integer, color_hue: "integer|null",
                icon: "string|null", rules: "string|null",
                search_excluded: boolean, ai_excluded: boolean }
