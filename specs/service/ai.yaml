# SSaC: AI 정리 (Wave 2) — 커맨드 계약: commands/ai.yaml
provider_adapters:
  ollama:
    endpoint_default: "http://localhost:11434"
    request: POST {endpoint}/api/chat {model, messages:[{role:system, content:SYS}, {role:user, content:USER}], format:'json', stream:false}
    response_extract: response.message.content → JSON.parse
    auth: 없음
  openai:
    endpoint_default: "https://api.openai.com/v1"
    request: POST {endpoint}/chat/completions {model, messages, response_format:{type:'json_object'}}
    response_extract: choices[0].message.content → JSON.parse
    auth: Authorization: Bearer {api_key}
  claude:
    endpoint_default: "https://api.anthropic.com/v1"
    request: POST {endpoint}/messages {model, system, messages:[{role:user, content}], max_tokens:1024}
    response_extract: content[0].text → JSON.parse (코드블록 ```json … ``` 제거)
    auth: x-api-key: {api_key}, anthropic-version: 2023-06-01
  gemini:
    endpoint_default: "https://generativelanguage.googleapis.com/v1beta"
    request: POST {endpoint}/models/{model}:generateContent?key={api_key} {contents, generationConfig.responseMimeType=application/json}
    response_extract: candidates[0].content.parts[0].text → JSON.parse
    auth: 쿼리 키 또는 헤더
  minimax:                                  # 2026-07-19 추가 — LLM 테스트용 (사용자 지정)
    endpoint_default: "https://api.minimax.io/anthropic/v1"
    request: claude 어댑터 재사용 (Anthropic Messages 호환 — top_k 등 일부 파라미터는 서버가 무시)
    response_extract: content[0].text → JSON.parse (claude 와 동일)
    auth: x-api-key(=ANTHROPIC_API_KEY 방식), 기본 모델 MiniMax-M2.5 (M2~M3 계열 지정 가능)

system_prompt: |
  # 실제 소스: repo/ai/prompts.rs::organize_format_contract() + compose_organize_system_prompt().
  # 이 블록은 발췌 요약 — 필드 목록이 코드와 어긋나면 코드가 맞다.
  "You organize and research multilingual (French/Korean/English) historical notes." STRICT JSON:
  {title?, year? (-9999..9999), tags?[<=6], region?, folder?, source_urls?[], confidence}
  Rules:
  - title/year/confidence: ai.yaml 이전 버전과 동일한 취지(간결한 제목, 확신도 반영)
  - tags: 노트북 태그 어휘(최대 50개, tag_vocabulary_top)를 후보로 주입해 우선 재사용시키고,
    부족할 때만 최대 3개 신규 태그 허용(총합 <=6)
  - folder: 노트북에 존재하는 폴더명 중 하나만 선택 가능(candidate_folders) — 없는 이름 생성 금지,
    애매하면 필드 생략
  - region/source_urls: 신규 필드(2026-08) — 역사적/지리적 지역명, 근거 URL. custom_guidance(설정
    화면의 "메타데이터" 프리셋 프롬프트)는 이 계약 문자열 뒤에 덧붙는다(계약 자체는 사용자가
    편집 불가)

flows:
  ai_organize_note:                                              # propose-only (P0-2) — 어떤 DB 쓰기도 하지 않는다
    steps:
      - gate: ai_translate_text/ai_cleanup_text와 동일 (provider=ollama+loopback → 통과, 그 외 → settings.ai_enabled 필수)
          — 이 커맨드가 게이트 없이 노트 본문을 클라우드로 보내던 것이 P0-1이었다. 다른 세
          평문 커맨드와 동일한 privacy_gate_ok를 맨 앞에서 검사한다.
      - validate: note 존재 → NOT_FOUND. 본문 길이 ≤ 8192자 → 아니면 잘라내 (VALIDATION 아님, 사용자 의도 보존)
      - load: title, year, tags, sections.body_md 합치기
      - call_provider:
          provider의 어댑터로 system + 본문 전송
          timeout 30s, 1회 재시도 (네트워크 일시 오류 대비, 5s 백오프)
      - parse_response: JSON.parse, 스키마 검증 (title:string, year:int, tags:array of string, confidence:number)
      - return: {title, year, tag_names, confidence} — DB 쓰기 없음. applied 필드도 없음(아직 아무것도
          적용 안 됐으므로 "적용된 필드" 개념 자체가 propose 시점엔 존재하지 않는다).
    decisions:
      - propose 응답의 region/folder/source_urls(2026-08 추가)는 ai_apply_organize가 아직 받지
        않는다(title/year/tags만 커밋) — 프론트가 어떻게 노출/적용하는지는 이 스펙 갱신 시점
        미확인, 코드 확인 필요(flag).
      - LLM 응답은 confidence와 무관하게 항상 사용자에게 모달(AiConfirmModal)로 노출한다 — 이전엔
        confidence>=0.5면 백엔드가 곧장 커밋한 뒤 모달을 "확인용"으로만 보여줬는데, 모달의
        Cancel이 이미 커밋된 걸 되돌리지 못해 눈속임이었다(P0-2). 이제 커밋은 오직 사용자가
        모달에서 Apply를 눌러 ai_apply_organize를 호출할 때만 일어난다. confidence는 프론트가
        "낮은 확신도" 경고를 보여주는 용도로만 쓴다.
      - 본문은 LLM 입력만으로 사용, 응답의 본문 필드는 무시. 모델이 본문을 다시 써 보내도 적용하지 않는다.
      - 결정적(deterministic) 동작이 아니므로 사용자가 "AI-tagged" 같은 시스템 태그를 추가하지 않는다.

  ai_apply_organize:                                             # AiConfirmModal "Apply" — 신규 (P0-2)
    steps:
      - validate: year 범위(YEAR_MIN..=YEAR_MAX) 밖이면 VALIDATION
      - tx (repo::notes::apply_ai_organize, note_update 둘 + note_set_tags 모두 한 트랜잭션):
          - note_update(title?: 새 제목이 기존과 다를 때, year?: 새 연도가 기존과 다를 때)
          - note_set_tags(제안 태그가 기존과 다를 때)
          - applied[] = 실제 변경된 필드만 기록
      - return: {applied}
    decisions:
      - 게이트 없음 — 네트워크 호출이 없는 순수 로컬 DB 쓰기라 "본문이 밖으로 나가는가"를 판정하는
        프라이버시 게이트가 적용될 지점이 아니다.
      - Cancel(clearProposal)은 이 커맨드를 절대 호출하지 않는다 — propose가 커밋하지 않았으므로
        되돌릴 것이 없다.

  ai_test_connection:
    steps:
      - ping: 프로바이더별 최소 호출 (Ollama는 GET /api/tags, 다른 프로바이더는 최소 토큰 1개)
      - measure: latency_ms 측정
      - return: {ok:true, latency_ms, models} 또는 throw IO

  ai_translate_text:                                            # 에디터 툴바 번역 토글 (마이크 아이콘 옆)
    steps:
      - gate: provider=ollama AND endpoint가 loopback → 통과. 그 외 → settings.ai_enabled=true 아니면 VALIDATION
      - validate: 본문 길이 ≤ 8192자 → 아니면 잘라냄 (VALIDATION 아님, ai_organize_note와 동일 정책)
      - call_provider: provider 어댑터로 "번역 전용" 시스템 프롬프트 + 본문 전송 (JSON 아님, 평문 응답)
          timeout 30s, 1회 재시도 (ai_organize_note와 동일한 execute_with_retry)
      - return: {translated} — DB 쓰기 없음 (note_update/section 관련 커맨드 전혀 호출 안 함)
    decisions:
      - 원본 섹션 본문은 이 흐름에서 한 번도 쓰기 대상이 되지 않는다 — 번역 결과는 프론트의
        읽기전용 뷰 상태에만 저장된다 (덮어쓰기 방지가 이 기능의 핵심 요구사항).
      - 트리거는 "타이핑마다"가 아니라 프론트가 debounce(약 1.4s 무입력) 후 1회 호출 + 토글을
        켤 때 1회 즉시 호출. 키 입력마다 클라우드 호출하는 설계는 비용/지연상 배제.

  ai_cleanup_text:                                               # AI 드롭다운 "에디터 내용 정리"
    steps:
      - gate: ai_translate_text와 완전히 동일 (provider=ollama+loopback → 통과, 그 외 → ai_enabled 필수)
      - validate: 본문 길이 ≤ 8192자 → 아니면 잘라냄. 잘라낸 뒤 공백뿐이면 cleaned="" 즉시 반환(호출 생략)
      - call_provider: provider 어댑터로 "정리 전용" 시스템 프롬프트 + 본문 전송 (평문/마크다운 응답,
          JSON 아님) — ai_translate_text와 동일한 send_text 어댑터 재사용, 시스템 프롬프트만 다름
      - return: {cleaned} — DB 쓰기 없음
    decisions:
      - 트리거 시점: 사용자가 드롭다운에서 명시적으로 클릭할 때만(자동/타이머 없음) — 프론트는 클릭
        직전 flushAll()로 현재 섹션의 미저장 편집을 먼저 반영한 뒤 그 본문을 text로 보낸다.
      - 결과는 새 섹션 탭에만 들어간다(section_create_with_body) — 원본 섹션은 이 흐름에서 절대
        쓰기 대상이 되지 않는다(ai_translate_text와 동일한 "원본 불변" 원칙, 차이는 결과를
        읽기전용 뷰가 아니라 새 탭에 영구 저장한다는 점).

  ai_generate_from_prompt:                                       # AI 드롭다운 "프롬프트 박스"
    steps:
      - validate_prompt: prompt.trim()이 비어있으면 VALIDATION (본문 cap과 달리 이건 진짜 에러 —
          입력 자체가 지시문이라 비면 호출할 이유가 없음)
      - gate: ai_cleanup_text와 동일
      - validate_input: prompt + context_text 합계 ≤ 32000자. 초과하면 VALIDATION으로 명시적 거절
      - call_provider: "사용자 요청으로 새 콘텐츠 작성, context_text는 관련 있을 때만 참고"
          시스템 프롬프트 + (prompt [+ context_text]) 전송
      - return: {generated} — DB 쓰기 없음
    decisions:
      - context_text는 현재 섹션의 body_md를 프론트가 flushAll() 이후 채워 넣는다(선택사항 —
        비워서 보내도 됨). AI가 참고만 하고 그대로 베끼도록 강제하지 않는다는 점이
        ai_organize_note(제목/태그를 결정적으로 덮어씀)와의 차이.
      - 결과는 ai_cleanup_text와 동일하게 새 섹션 탭에만 들어간다 — 원본은 절대 건드리지 않는다.

risks_additional:
  R9-ai-timeout: LLM 응답 지연 (특히 클라우드) → 작업 데드라인 45s(TEXT_OPERATION_DEADLINE, vision 75s) 안에서
    클라이언트 타임아웃 + 재시도·폴백 모델 1회(transport::with_model_fallback_until). 프런트 AiResultModal이
    같은 45s를 미러링해 "곧 시간 초과" 안내를 띄운다(PLAN-2026-09-05 §2 B-2). 로컬 Ollama 120s 연장안은
    2026-09-05 오너 결정으로 철회(GPU 없는 기기의 Ollama 사용자는 상정하지 않음) — 프로바이더 무관 45s.
  R10-ai-bypass: 사용자가 임의 endpoint 주입 가능 → 신뢰 경계 밖. 보완: 응답은 항상 JSON 파싱 검증 + confidence 게이트.
  R11-ai-privacy: 노트 본문이 외부로 송신됨 → settings_modal에 명시적 토글 (enable_ai_calls, 기본 false) + 호출 시 사용자 확인 다이얼로그 1회.
    ai_translate_text 는 동일 게이트를 커맨드 레이어에서 강제(프론트가 막혀도 백엔드가 재검증) —
    단, resolve_embed_config(R15)와 동일하게 provider=ollama+loopback 은 예외(추론이 기기를
    벗어나지 않음). ai_cleanup_text/ai_generate_from_prompt/ai_organize_note 모두 repo::ai
    계층의 동일 게이트 함수(privacy_gate_ok)를 공유(코드 중복 아님 — translate_inner와 같은
    판정 한 줄). ai_organize_note는 한때 이 게이트가 아예 없어 ai_enabled=false여도 본문이
    클라우드로 나갔다(P0-1, 2026-07-21 발견·수정) — invariant_ai_privacy_gate.rs가 회귀 가드.
    ai_apply_organize는 네트워크가 없는 로컬 커밋이라 이 게이트 대상이 아니다.
