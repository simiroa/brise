# 자동화 규칙 시나리오 — TDD 의 "먼저 쓰는 테스트" (PLAN-2026-10-08 §5 R1~R17, §10 장면·엣지)
#
# 규칙: 각 웨이브의 **첫 커밋**은 자기 웨이브 행을 도는 표 주도 테스트(빨강)이고, 구현이 그걸 초록으로 만든다.
#   - given/expect 는 구조화된 값이다(사람이 읽는 산문 아님). 노트는 corpus.json 의 id(n01, h05 …)로 가리킨다.
#   - test: 처음엔 null. 웨이브가 테스트를 쓰면 Rust `fn 이름` 또는 vitest it("제목") 을 적는다.
#   - status: planned → red(테스트 있음, 실패) → green(통과). green 인데 test 가 없거나 못 찾으면 검사 실패.
#   - 검사: scripts/check-automation-scenarios.mjs (보고 모드 — 구조 오류·green 누락만 실패)
#   - 시계: R5·R7·R8·R10 은 주입 가능한 시계가 필요하다(W1·W4 에서 `now` 를 인자로 받는다). 시각은 corpus 의 reference_now 기준 offset.
#   - 이 파일은 specs/features/ 가 아니다 — check:features 는 존재하는 테스트만 받기 때문에, 구현 전 시나리오는 여기 두고
#     웨이브가 초록이 되면 specs/features/automation.yaml 케이스로 옮긴다.

version: 1
scenarios:

